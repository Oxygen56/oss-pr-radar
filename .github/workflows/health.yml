name: Radar Health Watchdog

on:
  schedule:
    - cron: "*/15 * * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check effective scan and fallback freshness (read-only)
        run: |
          set +e
          python scripts/check_workflow_health.py \
            --max-effective-age-minutes 110 \
            --allow-fallback > health-result.json
          rc=$?
          cat health-result.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path("health-result.json").read_text(encoding="utf-8"))
          issues = list(dict.fromkeys([
              *(result.get("githubNaturalScheduleIssues") or []),
              *(result.get("githubNaturalScheduleWarnings") or []),
          ]))
          if issues:
              message = ", ".join(str(item) for item in issues)
              print(f"::warning title=Natural schedule degraded::{message}")
              summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
              with summary.open("a", encoding="utf-8") as handle:
                  handle.write("### Radar health\n\n")
                  handle.write("Effective scan/fallback is reported separately from natural scheduling.\n\n")
                  handle.write("Natural schedule: **degraded** (`" + message + "`)\n")
          PY
          exit "$rc"
