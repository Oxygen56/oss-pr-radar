name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install . pytest ruff
      - run: ruff check src/oss_pr_radar/llm.py scripts tests
      - run: ruff format --check src/oss_pr_radar/llm.py scripts tests
      - run: pytest -q
      - run: python -m compileall -q src scripts
