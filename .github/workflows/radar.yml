name: OSS PR Radar

on:
  schedule:
    - cron: "17 * * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      window_hours:
        description: "GitHub update window in hours"
        required: false
        default: "2"

concurrency:
  group: oss-pr-radar-state-writer
  cancel-in-progress: false

permissions: {}

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RADAR_DISPATCH_HMAC_KEY: ${{ secrets.RADAR_DISPATCH_HMAC_KEY }}
    permissions:
      contents: read
      issues: read
      pull-requests: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Restore integrity-checked state
        run: python scripts/state_branch.py restore
      - name: Restore managed lifecycle checkpoint
        run: >-
          PYTHONPATH=src python scripts/import_managed_snapshot.py
          --allow-missing
      - name: Ensure managed Ledger schema
        run: PYTHONPATH=src python -c "from pathlib import Path; from oss_pr_radar.managed_adapter import ManagedAdapter; ManagedAdapter(Path.cwd()).ensure()"
      - name: Recheck held opportunities and policy drift
        run: >-
          python scripts/recheck_watchlist.py
          state/watchlist.json
          state/pending_rechecks.json
          reports/watch_updates.json
          --limit 20
          --workers 3
      - name: Upload watch state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: watch-state-${{ github.run_id }}
          path: |
            reports/watch_updates.json
            state/watchlist.json
            state/pending_rechecks.json
          if-no-files-found: error
          retention-days: 14

  pr-followup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RADAR_DISPATCH_HMAC_KEY: ${{ secrets.RADAR_DISPATCH_HMAC_KEY }}
    permissions:
      checks: read
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Restore integrity-checked state
        run: python scripts/state_branch.py restore
      - name: Restore managed lifecycle checkpoint
        run: >-
          PYTHONPATH=src python scripts/import_managed_snapshot.py
          --allow-missing
      - name: Ensure managed Ledger schema
        run: PYTHONPATH=src python -c "from pathlib import Path; from oss_pr_radar.managed_adapter import ManagedAdapter; ManagedAdapter(Path.cwd()).ensure()"
      - name: Check open PR reviews, CI, and conflicts
        continue-on-error: true
        run: >-
          python scripts/check_open_prs.py
          state/pr_followup.json
          reports/pr_updates.json
          --workers 4
      - name: Upload PR follow-up state
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-followup-state-${{ github.run_id }}
          path: |
            reports/pr_updates.json
            state/pr_followup.json
          if-no-files-found: error
          retention-days: 14

  scan:
    needs: watch
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      issues: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: deepseek-v4-flash
      RADAR_DISPATCH_HMAC_KEY: ${{ secrets.RADAR_DISPATCH_HMAC_KEY }}
      WINDOW_HOURS: ${{ inputs.window_hours || '2' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate manual input
        run: |
          python - <<'PY'
          import os
          value = float(os.environ["WINDOW_HOURS"])
          if not 0.25 <= value <= 24:
              raise SystemExit("window_hours must be between 0.25 and 24")
          PY

      - name: Restore integrity-checked state
        run: python scripts/state_branch.py restore
      - name: Restore managed lifecycle checkpoint
        run: >-
          PYTHONPATH=src python scripts/import_managed_snapshot.py
          --allow-missing

      - name: Restore controller terminal feedback
        run: >-
          python scripts/state_branch.py restore
          --profile controller-feedback
          --allow-missing

      - name: Restore fresh watch results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: watch-state-${{ github.run_id }}
          path: .

      - name: Scan and review candidates
        run: >-
          PYTHONPATH=src python -m oss_pr_radar.scanner
          --window-hours "$WINDOW_HOURS"
          --seen state/seen.json
          --state state/runtime.json
          --pending-rechecks state/pending_rechecks.json
          --repo-cache state/repo_cache.json
          --scan-out reports/latest_scan.json
          --no-notify

      - name: Validate report contract
        run: python scripts/validate_report.py reports/latest_scan.json

      - name: Export managed lifecycle checkpoint
        run: >-
          PYTHONPATH=src python scripts/export_managed_snapshot.py

      - name: Upload scan bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scan-bundle-${{ github.run_id }}
          path: |
            reports/latest_scan.json
            reports/watch_updates.json
            reports/pr_updates.json
            state/*.json
            state/base_sha.txt
            state/managed_lifecycle.snapshot.json.gz
          if-no-files-found: error
          retention-days: 14

  build-state:
    needs: [scan, pr-followup]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      RADAR_DISPATCH_HMAC_KEY: ${{ secrets.RADAR_DISPATCH_HMAC_KEY }}
      RADAR_DISPATCH_MODE: ${{ vars.RADAR_DISPATCH_MODE || 'shadow' }}
      GITHUB_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scan-bundle-${{ github.run_id }}
          path: .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-followup-state-${{ github.run_id }}
          path: .

      - name: Import authenticated scan and follow-up state
        run: |
          PYTHONPATH=src python scripts/import_managed_snapshot.py
          python scripts/sync_managed_followup.py state/pr_followup.json reports/pr_updates.json
          PYTHONPATH=src python scripts/process_managed_replies.py

      - name: Build signed dispatch queue
        run: >-
          python scripts/build_dispatch_intents.py
          reports/latest_scan.json
          reports/dispatch_intents.json
          --queue state/dispatch_queue.json
          --mode "$RADAR_DISPATCH_MODE"

      - name: Refresh durable opportunity watchlist
        run: >-
          python scripts/build_watchlist.py
          reports/latest_scan.json
          state/watchlist.json

      - name: Export managed lifecycle and War Room projection
        run: |
          PYTHONPATH=src python scripts/export_managed_snapshot.py
          PYTHONPATH=src python scripts/export_war_room_projection.py \
            --ledger-copy state/radar_ledger.sqlite3 \
            --artifact reports/war_room_projection.json \
            --views reports/war_room_views.json \
            --feishu-outbox state/war_room_feishu_outbox.json \
            --codex-outbox state/war_room_codex_outbox.json \
            --source-commit "$GITHUB_SHA"

      - name: Upload pending state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pending-state-${{ github.run_id }}
          path: |
            reports/*.json
            state/*.json
            state/base_sha.txt
            state/managed_lifecycle.snapshot.json.gz
          if-no-files-found: error
          retention-days: 14

  persist-pending:
    needs: build-state
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RADAR_DISPATCH_HMAC_KEY: ${{ secrets.RADAR_DISPATCH_HMAC_KEY }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pending-state-${{ github.run_id }}
          path: .
      - name: Commit pending outbox and signed queue
        run: python scripts/state_branch.py publish

  notify:
    needs: persist-pending
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
      RADAR_DISPATCH_HMAC_KEY: ${{ secrets.RADAR_DISPATCH_HMAC_KEY }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pending-state-${{ github.run_id }}
          path: .
      - name: Send authenticated War Room Feishu projection
        continue-on-error: true
        run: >-
          python scripts/send_war_room_outbox.py
          state/war_room_feishu_outbox.json
          receipt/war_room_feishu_outbox.json
          --artifact reports/war_room_projection.json
      - name: Upload War Room receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: war-room-receipt-${{ github.run_id }}
          path: |
            receipt/war_room_feishu_outbox.json
          if-no-files-found: error
          retention-days: 14

  persist-receipt:
    needs: notify
    if: always() && needs.notify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RADAR_DISPATCH_HMAC_KEY: ${{ secrets.RADAR_DISPATCH_HMAC_KEY }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Restore latest committed state
        run: python scripts/state_branch.py restore
      - name: Restore managed lifecycle checkpoint
        run: >-
          PYTHONPATH=src python scripts/import_managed_snapshot.py
          --allow-missing
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pending-state-${{ github.run_id }}
          path: pending-state
      - name: Copy only the current War Room outbox
        run: cp pending-state/state/war_room_feishu_outbox.json state/war_room_feishu_outbox.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: war-room-receipt-${{ github.run_id }}
          path: receipt
      - name: Merge War Room receipt without accepting new events
        run: >-
          python scripts/merge_war_room_receipt.py
          state/war_room_feishu_outbox.json
          receipt/war_room_feishu_outbox.json
          state/war_room_feishu_outbox.json
      - name: Apply authenticated user-decision delivery state
        run: |
          PYTHONPATH=src python scripts/apply_war_room_receipt.py \
            state/radar_ledger.sqlite3 \
            state/war_room_feishu_outbox.json \
            receipt/war_room_feishu_outbox.json \
            state/seen.json
          PYTHONPATH=src python scripts/export_managed_snapshot.py
      - name: Commit receipt checkpoint
        run: python scripts/state_branch.py publish
