[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "oss-pr-radar"
version = "0.1.0"
description = "High-signal OSS issue and competing-PR radar for agents, AI infrastructure, and LLM algorithms"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Oxygen56" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.1",
]

[project.scripts]
oss-pr-radar = "oss_pr_radar.scanner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oss_pr_radar"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["state", "reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
